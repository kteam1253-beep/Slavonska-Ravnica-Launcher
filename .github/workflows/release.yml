name: Release Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare release notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const { version } = require('./package.json')
            const tag = `v${version}`
            const notesPath = `docs/releases/${tag}.md`
            if (!fs.existsSync(notesPath)) return
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo)
            if (!releases.some(release => release.tag_name === tag)) {
              await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Slavonska Ravnica ${version}`,
                body: fs.readFileSync(notesPath, 'utf8'),
                draft: true
              })
            }

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist -- --publish always

      - name: Publish completed release
        uses: actions/github-script@v7
        with:
          script: |
            const { version } = require('./package.json')
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo)
            const release = releases.find(item => item.tag_name === `v${version}`)
            if (!release) throw new Error('Release not found after build')
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id
            })
            for (const name of [`SlavonskaRavnica-Setup-${version}.exe`, 'latest.yml']) {
              if (!assets.some(asset => asset.name === name && asset.state === 'uploaded' && asset.size > 0)) {
                throw new Error(`Missing uploaded asset: ${name}`)
              }
            }
            if (release.draft) await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, draft: false
            })

      - name: Announce release on Discord
        uses: actions/github-script@v7
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        with:
          script: |
            const announce = require('./.github/scripts/announce-release.cjs')
            await announce({ github, context, core })
